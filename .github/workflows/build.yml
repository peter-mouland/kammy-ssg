name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'

      - name: Enable Corepack
        run: corepack enable

      - name: Get yarn cache directory
        id: yarn-cache-dir
        run: echo "dir=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --immutable
        env:
          CI: true
          # Only the e2e job drives a browser; the rest skip the ~100MB download.
          SKIP_PLAYWRIGHT_BROWSERS: '1'

      - name: Lint
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npx biome lint --changed --since=origin/${{ github.base_ref }} --no-errors-on-unmatched .
          else
            npx biome lint .
          fi

      # Ratchet, not a gate: the repo carries a backlog of type errors and CSS
      # convention violations recorded in .ratchet.json. This fails only if a change
      # ADDS to either backlog, so the counts can only go down over time.
      - name: Ratchet (type errors + CSS conventions)
        run: yarn ratchet

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'

      - name: Enable Corepack
        run: corepack enable

      - name: Get yarn cache directory
        id: yarn-cache-dir
        run: echo "dir=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --immutable
        env:
          CI: true
          # Only the e2e job drives a browser; the rest skip the ~100MB download.
          SKIP_PLAYWRIGHT_BROWSERS: '1'

      - name: Test
        run: yarn test

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'

      - name: Enable Corepack
        run: corepack enable

      - name: Get yarn cache directory
        id: yarn-cache-dir
        run: echo "dir=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --immutable
        env:
          CI: true
          # Only the e2e job drives a browser; the rest skip the ~100MB download.
          SKIP_PLAYWRIGHT_BROWSERS: '1'

      # No secrets here on purpose. This job only proves the app compiles and
      # bundles — every value the app reads from env is read at request time,
      # not at build time, so a build with no env is a valid build.
      - name: Build
        run: yarn build

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'

      - name: Enable Corepack
        run: corepack enable

      - name: Get yarn cache directory
        id: yarn-cache-dir
        run: echo "dir=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: ${{ runner.os }}-yarn-

      # Keyed on the lockfile because that is what pins the Playwright version, and the
      # browser build must match it. A miss just means postinstall downloads it again.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/yarn.lock') }}
          restore-keys: ${{ runner.os }}-playwright-

      # No SKIP_PLAYWRIGHT_BROWSERS here: postinstall fetches chromium if the cache missed.
      - name: Install dependencies
        run: yarn install --immutable
        env:
          CI: true

      # No secrets. The fixture server serves the whole site from test-fixtures/ with an
      # in-memory Firestore, so every value the app reads comes from the repo and this job
      # needs no credentials -- which is what makes a red run here mean the code broke.
      # (Player photos still point at the real Premier League CDN and simply fail offline;
      # the crawl only asserts on same-origin requests for that reason.)
      # Layer 2: real loaders against the rebuilt season. Shares this job because it shares
      # the install and the fixture data, and needs no browser of its own.
      - name: Loader payloads
        run: yarn harness

      - name: Route crawl
        run: yarn test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    name: deploy
    runs-on: ubuntu-latest
    needs: [lint, test, build, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'

      - name: Enable Corepack
        run: corepack enable

      - name: Get yarn cache directory
        id: yarn-cache-dir
        run: echo "dir=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --immutable
        env:
          CI: true
          # Only the e2e job drives a browser; the rest skip the ~100MB download.
          SKIP_PLAYWRIGHT_BROWSERS: '1'

      - name: Build
        run: yarn build
        env:
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          MY_FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.MY_FIREBASE_SERVICE_ACCOUNT_KEY }}
          VITE_FIREBASE_DATABASE_URL: ${{ secrets.VITE_FIREBASE_DATABASE_URL }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          FIRESTORE_DATABASE_ID: ${{ secrets.FIRESTORE_DATABASE_ID }}

      - name: Write Firebase service account credentials
        run: echo "$MY_FIREBASE_SERVICE_ACCOUNT_KEY" | base64 --decode > /tmp/firebase-sa.json
        env:
          MY_FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.MY_FIREBASE_SERVICE_ACCOUNT_KEY }}

      - name: Deploy to Firebase
        run: ./node_modules/.bin/firebase deploy --force
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/firebase-sa.json
